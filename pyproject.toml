[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apkm-repackager"
version = "0.1.0"
description = "macOS helper to repackage APKM bundles into installable APKs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
apkm-repackager = "apkm_repackager.app:main"
